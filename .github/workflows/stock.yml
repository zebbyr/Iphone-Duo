name: iPhone Duo stock check

on:
  schedule:
    # Every 30 min. GitHub may delay scheduled runs by several minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification only"
        type: boolean
        default: false

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check Apple + Best Buy pickup near 92075
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          ZIP: "92075"
          MAX_MILES: "50"
          TEST_NOTIFY: ${{ inputs.test_notify || 'false' }}
          # Scheduled run on a public repo: poll every 60s for 29 min (minutes are free).
          # Private repo or manual run: one quick check.
          LOOP_SECONDS: ${{ (github.event_name == 'schedule' && !github.event.repository.private) && '1740' || '0' }}
          INTERVAL: "60"
        run: python3 check_stock.py

      - name: Save alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
