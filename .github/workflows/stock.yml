name: iPhone Duo stock check

on:
  schedule:
    # Off-peak minutes (GitHub drops/delays runs at :00 and :30 under load).
    # Each run watches ~5h45m; the next queued run takes over when it ends,
    # so coverage is continuous even if a scheduled start is late.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification only"
        type: boolean
        default: false
      watch:
        description: "Keep watching for ~5h45m (like a scheduled run)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # lets a watch run queue the next one

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check Apple + Best Buy pickup near 92075
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          ZIP: "92075"
          MAX_MILES: "50"
          TEST_NOTIFY: ${{ inputs.test_notify || 'false' }}
          # Scheduled/watch run on a public repo: poll every 5 min for 5h45m.
          # Private repo or plain manual run: one quick check.
          LOOP_SECONDS: ${{ ((github.event_name == 'schedule' || inputs.watch) && !github.event.repository.private) && '20700' || '0' }}
          INTERVAL: "300"
        run: python3 check_stock.py

      - name: Save alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}

      # GitHub's schedule is unreliable on new repos, so each watch run queues
      # the next one. It waits in the concurrency group until this run ends.
      - name: Queue next watch run
        if: always() && (github.event_name == 'schedule' || inputs.watch) && !github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stock.yml --repo "$GITHUB_REPOSITORY" --ref main -f watch=true
